name: Update GitHub Stats Cards

on:
  schedule:
    - cron: '0 */6 * * *'   # runs every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download main stats card
        run: |
          curl -sf "https://github-readme-stats.vercel.app/api?username=Tanmoy70&theme=radical&hide_border=false&include_all_commits=true&count_private=false&show_icons=true" -o stats.svg.tmp \
            && mv stats.svg.tmp stats.svg \
            || echo "Stats card fetch failed this run, keeping previous version"

      - name: Download top languages card
        run: |
          curl -sf "https://github-readme-stats.vercel.app/api/top-langs/?username=Tanmoy70&theme=radical&hide_border=false&include_all_commits=true&count_private=false&layout=compact" -o top-langs.svg.tmp \
            && mv top-langs.svg.tmp top-langs.svg \
            || echo "Top-langs card fetch failed this run, keeping previous version"

      - name: Download streak stats card
        run: |
          curl -sf "https://streak-stats.demolab.com/?user=Tanmoy70&theme=radical&hide_border=false" -o streak-stats.svg.tmp \
            && mv streak-stats.svg.tmp streak-stats.svg \
            || echo "Streak card fetch failed this run, keeping previous version"

      - name: Download top contributed repo card
        run: |
          curl -sf "https://github-contributor-stats.vercel.app/api?username=Tanmoy70&limit=5&theme=radical&combine_all_yearly_contributions=true" -o contributor-stats.svg.tmp \
            && mv contributor-stats.svg.tmp contributor-stats.svg \
            || echo "Contributor stats card fetch failed this run, keeping previous version"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in stats.svg top-langs.svg streak-stats.svg contributor-stats.svg; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          git diff --staged --quiet || git commit -m "Update GitHub stats cards"
          git push
