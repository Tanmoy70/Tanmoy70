name: Update GitHub Stats Cards

on:
  schedule:
    - cron: '0 */6 * * *'   # runs every 6 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all cards with diagnostics
        run: |
          fetch_card () {
            local name="$1"
            local url="$2"
            local outfile="$3"

            echo "::group::Fetching $name"
            status=$(curl -s -o "$outfile.tmp" -w "%{http_code}" "$url")

            if [ "$status" = "200" ] && [ -s "$outfile.tmp" ]; then
              mv "$outfile.tmp" "$outfile"
              echo "$name OK (HTTP $status)"
            else
              echo "$name FAILED (HTTP $status)"
              echo "--- Response body (first 500 chars) ---"
              head -c 500 "$outfile.tmp" 2>/dev/null || true
              echo ""
              echo "--- Keeping previous version of $outfile if one exists ---"
              rm -f "$outfile.tmp"
            fi
            echo "::endgroup::"
          }

          fetch_card "Main stats card" \
            "https://github-readme-stats.vercel.app/api?username=Tanmoy70&theme=radical&hide_border=false&include_all_commits=true&count_private=false&show_icons=true" \
            "stats.svg"

          fetch_card "Top languages card" \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Tanmoy70&theme=radical&hide_border=false&include_all_commits=true&count_private=false&layout=compact" \
            "top-langs.svg"

          fetch_card "Streak stats card" \
            "https://streak-stats.demolab.com/?user=Tanmoy70&theme=radical&hide_border=false" \
            "streak-stats.svg"

          fetch_card "Top contributed repo card" \
            "https://github-contributor-stats.vercel.app/api?username=Tanmoy70&limit=5&theme=radical&combine_all_yearly_contributions=true" \
            "contributor-stats.svg"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in stats.svg top-langs.svg streak-stats.svg contributor-stats.svg; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          git diff --staged --quiet || git commit -m "Update GitHub stats cards"
          git push
